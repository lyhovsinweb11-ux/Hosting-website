<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreshFruit | Sign In</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container" aria-label="Main navigation">
        <a href="index.html" class="brand" aria-label="FreshFruit home">
          <span class="brand-mark">F</span>
          <span>FreshFruit</span>
        </a>
        <button class="nav-toggle" type="button" aria-label="Toggle navigation">☰</button>
        <ul class="nav-menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="fruits.html">Fruits</a></li>
          <li><a href="benefits.html">Benefits</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li class="auth-logged-out"><a href="signin.html">Sign In</a></li>
          <li class="auth-logged-out"><a href="signup.html">Sign Up</a></li>
          <li class="auth-logged-in hidden"><a href="profile.html">Profile</a></li>
          <li class="auth-logged-in hidden"><button class="nav-signout" type="button">Sign Out</button></li>
        </ul>
      </nav>
    </header>

    <main class="auth-layout">
      <div class="form-card auth-form">
        <h2 style="margin-bottom: 20px;">Welcome Back</h2>
        <form id="signinForm" novalidate>
          <div class="form-group">
            <label for="signinEmail">Email</label>
            <input id="signinEmail" name="email" type="email" />
          </div>

          <div class="form-group">
            <label for="signinPassword">Password</label>
            <input id="signinPassword" name="password" type="password" />
          </div>

          <div class="checkbox-row">
            <input id="rememberMe" type="checkbox" />
            <label for="rememberMe">Remember Me</label>
            <a href="signup.html" class="forgot-link">Forgot Password</a>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
          <div id="signinError" class="alert error" aria-live="polite"></div>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© 2026 FreshFruit.</p>
        <div class="footer-links">
          <a href="signup.html">Create Account</a>
          <a href="index.html">Home</a>
        </div>
      </div>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
